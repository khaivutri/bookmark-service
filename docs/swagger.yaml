basePath: /
definitions:
  dto.ShortenURLReq:
    properties:
      exp:
        description: Exp is the expiration time of the shortened URL in seconds.
        minimum: 5
        type: integer
      url:
        description: URL is the original URL to shorten.
        example: https://example.com
        type: string
    required:
    - exp
    - url
    type: object
  dto.ShortenURLRes:
    properties:
      code:
        description: Code is the shortened URL code returned to the client.
        example: AbCDeFK
        type: string
      message:
        description: Message provides a status message for the operation.
        example: Shorten URL generated successfully!
        type: string
    type: object
  model.HealthReport:
    properties:
      dependency:
        additionalProperties:
          type: string
        example:
          ' "postgres"': ' "UP"}'
          '{"redis"': ' "UP"'
        type: object
      instance_id:
        example: cbe1a562-596b-45d0-bf8b-a999b23b184a
        type: string
      message:
        example: OK
        type: string
      service_name:
        example: bookmark_service
        type: string
    type: object
  user.RegisterData:
    properties:
      created_at:
        example: "2026-07-21T12:34:56Z"
        type: string
      display_name:
        example: John Doe
        type: string
      email:
        example: john.doe@example.com
        type: string
      id:
        example: 7d80f755-7dce-4c95-b8bf-75bb8e240ef2
        type: string
      updated_at:
        example: "2026-07-21T12:34:56Z"
        type: string
      username:
        example: johndoe
        type: string
    type: object
  user.RegisterRequest:
    properties:
      display_name:
        example: John Doe
        maxLength: 20
        minLength: 3
        type: string
      email:
        example: john.doe@example.com
        type: string
      password:
        example: Password123@
        type: string
      username:
        example: johndoe
        maxLength: 20
        minLength: 3
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  user.RegisterResponse:
    properties:
      data:
        $ref: '#/definitions/user.RegisterData'
      message:
        type: string
    type: object
info:
  contact: {}
  description: This is a simple REST API for a bookmark service - Demo MLIoT Lab.
  title: Bookmark Service API
  version: "2.0"
paths:
  /health-check:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthReport'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.HealthReport'
      summary: Health Check
      tags:
      - Health Check
  /v1/links/redirect/{code}:
    get:
      description: Resolves a short code and redirects the client to the original
        URL.
      parameters:
      - description: Short code
        in: path
        name: code
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "302":
          description: Redirect to the original URL
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Code not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Redirect to original URL
      tags:
      - ShortenURL
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Creates a unique short code for the given URL and returns it.
      parameters:
      - description: Shorten URL request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ShortenURLReq'
      produces:
      - application/json
      responses:
        "200":
          description: Shorten URL response
          schema:
            $ref: '#/definitions/dto.ShortenURLRes'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create Shorten Link
      tags:
      - ShortenURL
  /v1/users/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with the provided username, display
        name, password, and email.
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Register response
          schema:
            $ref: '#/definitions/user.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - User
swagger: "2.0"
