services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  bookmark-service:
    image: bookmark-service-test:latest
    build: .
    container_name: bookmark-service
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - REDIS_ADDRESS=redis:6379

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=bookmark
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
